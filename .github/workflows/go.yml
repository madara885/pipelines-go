name: Go CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build and Test
        run: |
          if [ -f go.mod ]; then
            go build -v ./...
            go test -v ./...
          else
            echo "No go.mod found, skipping."
          fi